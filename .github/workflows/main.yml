name: Build Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev liblzma-dev lld llvm
          pip install --upgrade pip
          pip install Cython==0.29.37 "buildozer==1.5.0"

      - name: Build with Buildozer
        run: |
          export BUILDOZER_ALLOW_ROOT_ERRORS=1
          export ANDROIDSDK=$ANDROID_HOME
          
          # Жестко блокируем версию Cython на уровне компилятора Android
          export P4A_cython_version=0.29.37
          
          yes | buildozer android debug
        env:
          TERM: xterm

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polniy-Strategy-APK
          path: bin/*.apk
